version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: parknexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parknexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parknexus_secret}
      POSTGRES_DB: ${POSTGRES_DB:-parknexus_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parknexus} -d ${POSTGRES_DB:-parknexus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parknexus-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-parknexus}:${POSTGRES_PASSWORD:-parknexus_secret}@db:5432/${POSTGRES_DB:-parknexus_db}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-for-parknexus-enterprise-app}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ENVIRONMENT: production
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:5173", "http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parknexus-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: parknexus_postgres_data
